# 「布谷」生产部署:PostgreSQL + Redis + 服务端同机
# 用法:先导出必需环境变量(缺失时 compose 直接报错退出,不会用占位值起服务),再执行
#   export POSTGRES_PASSWORD=... BUGU_JWT_SECRET=... BUGU_ADMIN_SEED_PASSWORD=...
#   docker compose -f docker-compose.prod.yml up -d
# 安全:PostgreSQL/Redis 不映射宿主端口,仅容器网内可达;server 只绑回环 127.0.0.1:8081,
# 公网唯一入口是 Nginx 80/443(见 .trae/skills/bugu-deploy/references/topology.md)
services:
  postgres:
    image: postgres:16-alpine
    container_name: bugu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugu
      POSTGRES_USER: bugu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugu -d bugu"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: bugu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bugu-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TZ: Asia/Shanghai
      # 生产 profile:application-prod.yml 中的 JWT/口令占位符无默认值,缺失即启动失败
      SPRING_PROFILES_ACTIVE: prod
      # Spring relaxed binding:环境变量覆盖 application.yml 中写死的同名属性
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bugu
      SPRING_DATASOURCE_USERNAME: bugu
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?必须设置 SPRING_DATASOURCE_PASSWORD(与 POSTGRES_PASSWORD 一致)}
      # 生产 JWT 密钥(≥32 字节随机串,生成:openssl rand -base64 48)
      BUGU_JWT_SECRET: ${BUGU_JWT_SECRET:?必须设置 BUGU_JWT_SECRET(≥32 字节随机串)}
      # 后台 SUPER 初始密码(首次启动创建,幂等)
      BUGU_ADMIN_SEED_PASSWORD: ${BUGU_ADMIN_SEED_PASSWORD:?必须设置 BUGU_ADMIN_SEED_PASSWORD}
      # 腾讯云 COS(头像签名直传):未配置时头像上传提示「对象存储未配置」,其余功能不受影响
      # BUGU_COS_SECRET_ID: <访问管理 CAM 子账号 SecretId>
      # BUGU_COS_SECRET_KEY: <对应 SecretKey>
      # BUGU_COS_BUCKET: <桶全名>
      # BUGU_COS_REGION: ap-shanghai
      # BUGU_COS_PUBLIC_BASE_URL: https://cdn.example.com # 可选:CDN 加速域名
      # 可选通道(LLM/极光推送/火山短信)同样经 BUGU_* 环境变量覆盖,按需追加

volumes:
  pg-data:
  redis-data:
