# 与 app/ 一致的内存约束,避免 Kotlin daemon / 测试进程互挤
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

# 无 Xcode 的机器上,Kotlin/Native 编译器改从 Maven Central 下载(不依赖 JetBrains CDN)
kotlin.native.distribution.downloadFromMaven=true
