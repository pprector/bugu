# 本地开发 profile:日志级别 + 本地代理;凭证类配置统一放 server/application-local.yml(gitignore)
logging:
  level:
    com.bugu: DEBUG

management:
  endpoint:
    health:
      show-details: always

# 本地开发开启真实外部通道(集成测试不激活 dev,不受影响):
