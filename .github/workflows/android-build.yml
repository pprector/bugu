# Android 构建门禁
#
# 覆盖:编译 Kuikly 模块(bugu-ui / bugu-entry)→ 发布 AAR 到 app/repo → 编译 app 的 debug/release。
# 任一步失败都会让 job 失败,不存在 continue-on-error 或静默跳过。
#
# 需要的仓库 secret(用于 release 签名,keystore 绝不入库):
#   BUGU_KEYSTORE_BASE64   release keystore 的 base64(本机执行:
#                          `base64 -i your-release.jks | tr -d '\n'` 后粘贴)
#   BUGU_STORE_PASSWORD    keystore 口令
#   BUGU_KEY_ALIAS         签名别名
#   BUGU_KEY_PASSWORD      别名口令
#   可选:
#   BUGU_JPUSH_APPKEY      极光 AppKey,缺省时沿用 app 里的 PLACEHOLDER-APPKEY
#   BUGU_KUIKLY_TOKEN      拉取 KuiklyUI 私有仓库的 token(仅 full-chain 手动跑需要)
#
# 说明:
#   KuiklyUI 工程不在本仓库内。默认 job 用仓库里已提交的 AAR(app/repo)做 app-only 构建;
#   全链路 job 只在手动触发且填了 kuikly_repository 时运行,避免默认红。
name: android-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      kuikly_repository:
        description: 'KuiklyUI 仓库(owner/repo)。填写后跑全链路:编译 Kuikly → AAR → app'
        required: false
        default: ''
      kuikly_ref:
        description: 'KuiklyUI 分支/commit(留空用默认分支)'
        required: false
        default: ''

jobs:
  app-build:
    name: app debug+release(AAR 取自仓库 app/repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 从 secrets 写入 app/local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.BUGU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUGU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUGU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUGU_KEY_PASSWORD }}
          JPUSH_APPKEY: ${{ secrets.BUGU_JPUSH_APPKEY }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 secret BUGU_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?缺少 secret BUGU_STORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 secret BUGU_KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 secret BUGU_KEY_PASSWORD}"
          mkdir -p "$RUNNER_TEMP/bugu-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bugu-signing/release.jks"
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "bugu.release.storeFile=$RUNNER_TEMP/bugu-signing/release.jks"
            echo "bugu.release.storePassword=$STORE_PASSWORD"
            echo "bugu.release.keyAlias=$KEY_ALIAS"
            echo "bugu.release.keyPassword=$KEY_PASSWORD"
            if [ -n "${JPUSH_APPKEY:-}" ]; then echo "jpush.appKey=$JPUSH_APPKEY"; fi
          } > app/local.properties

      - name: 构建(app-only)
        run: ./scripts/ci-build.sh --app-only

      - uses: actions/upload-artifact@v4
        with:
          name: bugu-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  full-chain:
    name: Kuikly → AAR → app 全链路
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.kuikly_repository != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 检出 KuiklyUI
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kuikly_repository }}
          ref: ${{ inputs.kuikly_ref }}
          token: ${{ secrets.BUGU_KUIKLY_TOKEN }}
          path: kuikly-ui

      - name: 去掉 KuiklyUI 里本机专用的 aapt2 路径覆盖
        run: sed -i '/aapt2FromMavenOverride/d' kuikly-ui/gradle.properties

      - name: 从 secrets 写入 app/local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.BUGU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUGU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUGU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUGU_KEY_PASSWORD }}
          JPUSH_APPKEY: ${{ secrets.BUGU_JPUSH_APPKEY }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 secret BUGU_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?缺少 secret BUGU_STORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 secret BUGU_KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 secret BUGU_KEY_PASSWORD}"
          mkdir -p "$RUNNER_TEMP/bugu-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bugu-signing/release.jks"
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "bugu.release.storeFile=$RUNNER_TEMP/bugu-signing/release.jks"
            echo "bugu.release.storePassword=$STORE_PASSWORD"
            echo "bugu.release.keyAlias=$KEY_ALIAS"
            echo "bugu.release.keyPassword=$KEY_PASSWORD"
            if [ -n "${JPUSH_APPKEY:-}" ]; then echo "jpush.appKey=$JPUSH_APPKEY"; fi
          } > app/local.properties

      - name: 构建(full:Kuikly → AAR → app)
        env:
          KUIKLY_UI_DIR: ${{ github.workspace }}/kuikly-ui
        run: ./scripts/ci-build.sh --full

      - uses: actions/upload-artifact@v4
        with:
          name: bugu-apk-full-chain
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
